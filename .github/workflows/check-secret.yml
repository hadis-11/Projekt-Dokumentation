
name: Secret Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Secret überprüfen
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
        run: |
          if [ -n "$TEST_SECRET" ]; then
            echo "Das Secret wurde erfolgreich gefunden!"
          else
            echo "Das Secret fehlt!"
            exit 1
          fi
